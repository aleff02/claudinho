name: APK Laudo de Avaria
on:
  push:
    branches: [main]
    paths: ['laudo-android/**', '.github/workflows/laudo-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: laudo-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|AAPT|\.xml:[0-9]" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -A8 "What went wrong" build.log | head -14 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - name: Publicar na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LaudoAvaria.apk
          gh release delete laudo-apk -y --cleanup-tag || true
          gh release create laudo-apk LaudoAvaria.apk --title "Laudo de Avaria (APK)" --latest=false \
            --notes "App dos frotas para registrar avarias. Instale o APK (permita 'fontes desconhecidas'), abra e cole o link de ativação recebido no WhatsApp."
